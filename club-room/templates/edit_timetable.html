<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>タイムテーブル編集</title>

<style>

body{
    font-family:"Yu Gothic",sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:10px;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>
<body>

<h1>タイムテーブル編集</h1>

<form action="/update_timetable" method="post">

    <input
        type="hidden"
        name="id"
        value="{{ timetable['_id'] }}">

    <label>ライブ名</label>

    <input
        type="text"
        name="live_name"
        value="{{ timetable['live_name'] }}">

    <br><br>

    <label>出演順</label>

    <textarea
        name="bands"
        rows="15">{% for row in timetable["timetable"] %}{{ row["name"] }}
{% endfor %}</textarea>

    <br><br>

    <button type="submit">
        保存
    </button>

</form>

<br><br>

<form action="/admin" method="get">

    <button type="submit">
        管理画面へ戻る
    </button>

</form>

</body>
</html>
